<!DOCTYPE html>
<html lang="pt-BR" data-tema="escuro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data: https:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'">
<title>Galeria Virtual</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main class="wrap">
  <header class="hero">
    <h1 id="titulo">Galeria Virtual</h1>
    <p class="sub" id="subtitulo"></p>
    <p class="sub" id="descricao"></p>
    <div class="bar">
      <input id="busca" type="search" placeholder="Buscar em todos os campos" aria-label="Buscar">
      <select id="ordem" aria-label="Ordenar">
        <option value="curadoria">Ordem da curadoria</option>
        <option value="titulo">Título (A–Z)</option>
      </select>
      <button id="tema" class="btn" type="button">Tema claro</button>
    </div>
    <div class="bar" id="acoes">
      <button id="add" class="btn pri" type="button">Adicionar imagens</button>
      <button id="exp" class="btn" type="button">Exportar backup</button>
      <button id="imp" class="btn" type="button">Importar backup</button>
      <input id="fileImg" type="file" accept="image/*" multiple hidden>
      <input id="fileJson" type="file" accept="application/json" hidden>
    </div>
  </header>
  <nav id="chips" class="chips" aria-label="Categorias"></nav>
  <p id="catText" class="sub"></p>
  <p id="count" class="muted" aria-live="polite"></p>
  <section id="gallery" class="grid" aria-label="Galeria"></section>
  <p id="empty" class="empty" hidden></p>
  <footer id="rodape" class="muted"></footer>
</main>
<div id="toasts" aria-live="polite"></div>

<dialog id="viewer" aria-labelledby="vTitle">
  <div class="vwrap">
    <div class="vimg" id="vImg"></div>
    <aside class="vinfo">
      <div id="vInfo"></div>
      <div class="bar">
        <button id="prev" class="btn" type="button" aria-label="Anterior">←</button>
        <button id="next" class="btn" type="button" aria-label="Próximo">→</button>
        <button id="edit" class="btn" type="button">Editar</button>
        <button id="del" class="btn" type="button">Excluir</button>
        <button id="vClose" class="btn" type="button">Fechar</button>
      </div>
    </aside>
  </div>
</dialog>

<dialog id="form" aria-labelledby="fTitle">
  <form id="f">
    <h2 id="fTitle"></h2>
    <label>Título *<input name="titulo" required maxlength="160"></label>
    <label>Descrição<textarea name="descricao" rows="3"></textarea></label>
    <div class="two"><label>Autoria<input name="autor"></label><label>Data<input name="data"></label></div>
    <div class="two"><label id="tipoLabel">Tipo<select name="tipo" id="selTipo"></select></label><label id="catLabel">Categoria<select name="categoria" id="selCat"></select></label></div>
    <div class="two"><label>Local<input name="local"></label><label>Licença<input name="licenca"></label></div>
    <label>Fonte (URL ou referência)<input name="fonte"></label>
    <label>Tags (separadas por vírgula)<input name="tags"></label>
    <div class="bar end"><button type="button" class="btn" id="fCancel">Cancelar</button><button class="btn pri">Salvar</button></div>
  </form>
</dialog>

<script src="data/config.js"></script>
<script src="data/acervo.js"></script>
<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
